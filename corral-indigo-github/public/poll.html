<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheduling Poll</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="top-nav">
  <div style="display:flex; align-items:center; gap:16px;">
    <a href="/" class="landing-logo" style="text-decoration:none; font-size:16px;">Corral<span class="beta-tag">Beta</span></a>
    <a href="/" style="font-size:13px;">← New poll</a>
  </div>
  <div class="top-nav-links">
    <a href="#" id="toggleViewLink" style="display:none;"></a>
    <a class="feedback-link" href="/feedback.html">✎ Send feedback</a>
  </div>
</div>
<div class="wrap">
  <div id="app">
    <div class="loading">Loading poll…</div>
  </div>
</div>

<script src="/logic.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const pollId = params.get("id");
const organizerToken = new URLSearchParams(location.hash.slice(1)).get("organizer") || "";
const isOrganizer = !!organizerToken;

const app = document.getElementById("app");
const toggleLink = document.getElementById("toggleViewLink");

if (!pollId) {
  app.innerHTML = '<div class="error-state">No poll id given. Use the link you were sent.</div>';
} else {
  if (isOrganizer) {
    toggleLink.style.display = "inline";
    toggleLink.textContent = "View as participant";
    toggleLink.href = `/poll.html?id=${encodeURIComponent(pollId)}`;
  }
}

let pollData = null;
const organizerHeaders = { "X-Organizer-Token": organizerToken };
async function updatePoll(changes) {
  const res = await fetch("/api/update-poll", {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({pollId, organizerToken, ...changes})
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Change was not saved.");
  return data;
}
function saveError(err) { alert(`Could not save: ${err.message}`); }
async function copyText(value) {
  try { await navigator.clipboard.writeText(value); return true; }
  catch { window.prompt("Copy this message:", value); return false; }
}
async function copyWithFeedback(button, value) {
  const copied = await copyText(value);
  if (!copied) return;
  const original = button.dataset.originalLabel || button.textContent;
  button.dataset.originalLabel = original;
  button.textContent = "✓ Copied";
  clearTimeout(button.copyResetTimer);
  button.copyResetTimer = setTimeout(() => { if (button.isConnected) button.textContent = original; }, 2400);
}
function mailDraft(subject, body) { location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`; }
function reminderText(names) {
  const deadline = pollData.deadlineIso ? `Please respond by ${formatViewerLocal(pollData.deadlineIso)}.\n\n` : "";
  return `Hi ${names.join(", ")},\n\nA quick reminder to add your availability for “${pollData.title}”. It takes about a minute.\n\n${deadline}${location.origin}/poll.html?id=${encodeURIComponent(pollId)}\n\nThank you.`;
}

async function loadPoll() {
  try {
    const res = await fetch(`/api/get-poll?id=${encodeURIComponent(pollId)}`, {headers: organizerHeaders, cache: "no-store"});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not load poll.");
    pollData = data;
    if (isOrganizer && !data.participants) throw new Error("This organizer link is invalid or belongs to an older poll. Use a new private organizer link.");
    if (isOrganizer) renderOrganizerView();
    else renderParticipantView();
  } catch (err) {
    app.innerHTML = `<div class="error-state">${escapeHtml(err.message)}</div>`;
  }
}

if (pollId) loadPoll();

function deadlineBanner() {
  if (pollData.finalizedSlotId) return "";
  if (!pollData.deadlineIso) return "";
  const passed = isPastDeadline(pollData.deadlineIso);
  const localDeadline = formatViewerLocal(pollData.deadlineIso);
  if (passed) {
    return `<div class="banner warn"><div class="title">Responses closed</div><div class="body">The response deadline (${escapeHtml(localDeadline)}) has passed.</div></div>`;
  }
  return `<div class="banner info"><div class="title">Open until ${escapeHtml(localDeadline)}</div><div class="body">Responses submitted after this time won't be counted.</div></div>`;
}

function finalizedBanner(slots) {
  if (!pollData.finalizedSlotId) return "";
  const slot = slots.find((s) => s.id === pollData.finalizedSlotId);
  if (!slot) return "";
  return `<div class="banner ok"><div class="title">✓ Meeting confirmed: ${escapeHtml(formatViewerLocal(slot.iso))}</div><div class="body">The organizer has locked in this time.</div></div>`;
}

// ---------------- Participant view ----------------
function renderParticipantView() {
  const { title, slots, mustAttend } = pollData;
  const closed = !!pollData.finalizedSlotId || isPastDeadline(pollData.deadlineIso);

  app.innerHTML = `
    <div class="masthead">
      <div class="eyebrow">Scheduling poll<span class="beta-tag">Beta</span></div>
      <h1>${escapeHtml(title)}</h1>
      <p class="sub">Let us know your availability for each proposed time. Times below are shown in your local timezone (${escapeHtml(viewerTimezone())}).</p>
    </div>

    ${finalizedBanner(slots)}
    ${deadlineBanner()}

    <div class="panel" id="formPanel" style="${closed ? "opacity:0.6;" : ""}">
      <div class="field-block">
        <label class="field-label">Your name</label>
        <div class="row">
          <input type="text" id="participantFirst" placeholder="First name" ${closed ? "disabled" : ""}>
          <input type="text" id="participantLast" placeholder="Last name" ${closed ? "disabled" : ""}>
        </div>
        <div class="field-error" id="nameError" style="display:none;"></div>
        <div id="matchNotice" style="margin-top:8px; font-size:13.5px;"></div>
        <div id="manualLinkBlock" style="display:none; margin-top:8px;">
          <label class="field-label" style="font-weight:500;">Are you one of the Must-Attend participants under a different spelling?</label>
          <select id="manualLinkSelect">
            <option value="">No — I'm a regular participant</option>
            ${mustAttend.map((m) => `<option value="${escapeHtml(m)}">Yes — I'm ${escapeHtml(m)}</option>`).join("")}
          </select>
        </div>
      </div>

      <div class="slot-chooser-head"><div><strong>Proposed times</strong><p>Swipe sideways or use the arrows. Choose times you can actually attend.</p></div><span id="answerProgress">0 of ${slots.length} answered</span></div>
      <div class="slot-carousel" id="slotForms" role="region" aria-label="Proposed meeting times" tabindex="0"></div>
      <div class="slot-carousel-nav"><button class="ghost" id="prevSlotBtn" type="button" aria-label="Previous proposed time">← Previous</button><span id="slotPosition" aria-live="polite">Time 1 of ${slots.length}</span><button class="ghost" id="nextSlotBtn" type="button" aria-label="Next proposed time">Next →</button></div>

      <div class="field-error" id="submitError" style="display:none; margin-bottom:12px;"></div>
      <button class="primary" id="submitBtn" type="button" ${closed ? "disabled" : ""}>${closed ? "Responses closed" : "Submit response"}</button>
      <div id="successMsg" style="display:none; margin-top:14px; color:var(--teal); font-size:14px;"></div>
      <div id="groupOverview" aria-live="polite"></div>
    </div>
  `;

  const slotForms = document.getElementById("slotForms");
  const cards = [];
  slots.forEach((slot, index) => {
    const block = document.createElement("fieldset");
    block.className = "slot-card";
    block.dataset.slotId = slot.id;
    block.innerHTML = `
      <legend>Time ${index + 1} of ${slots.length}</legend>
      <div class="slot-date">${escapeHtml(formatViewerLocal(slot.iso))}</div>
      <div class="group-count" data-count-slot="${escapeHtml(slot.id)}"></div>
      <div class="choice-row" role="group" aria-label="Availability for ${escapeHtml(formatViewerLocal(slot.iso))}">
        <label class="choice yes"><input type="radio" name="resp-${slot.id}" value="yes" ${closed ? "disabled" : ""}><span><b aria-hidden="true">✓</b> Yes</span></label>
        <label class="choice maybe"><input type="radio" name="resp-${slot.id}" value="if_needed" ${closed ? "disabled" : ""}><span><b aria-hidden="true">◔</b> Maybe</span></label>
        <label class="choice no"><input type="radio" name="resp-${slot.id}" value="no" ${closed ? "disabled" : ""}><span><b aria-hidden="true">×</b> No</span></label>
      </div>
    `;
    slotForms.appendChild(block);
    cards.push(block);
  });
  renderGroupCounts();
  if (!window.corralParticipantRefresh && pollData.showGroupCounts) {
    window.corralParticipantRefresh = setInterval(async () => {
      try {
        const res = await fetch(`/api/get-poll?id=${encodeURIComponent(pollId)}`, {cache:"no-store"});
        if (res.ok) { pollData = await res.json(); renderGroupCounts(document.getElementById("successMsg")?.style.display === "block"); }
      } catch (_) { /* Keep the last visible totals until the next refresh. */ }
    }, 30000);
  }

  function activeIndex() {
    if (!cards.length) return 0;
    return cards.reduce((best, card, index) =>
      Math.abs(card.offsetLeft - cards[0].offsetLeft - slotForms.scrollLeft) < Math.abs(cards[best].offsetLeft - cards[0].offsetLeft - slotForms.scrollLeft) ? index : best, 0);
  }
  function updatePosition() {
    const index = activeIndex();
    document.getElementById("slotPosition").textContent = `Time ${index + 1} of ${slots.length}`;
    document.getElementById("prevSlotBtn").disabled = index === 0;
    document.getElementById("nextSlotBtn").disabled = index === slots.length - 1;
  }
  function goToCard(index) {
    cards[Math.max(0, Math.min(cards.length - 1, index))]?.scrollIntoView({behavior:"smooth", block:"nearest", inline:"start"});
  }
  function updateProgress() {
    const answered = slots.filter(slot => document.querySelector(`input[name="resp-${slot.id}"]:checked`)).length;
    document.getElementById("answerProgress").textContent = `${answered} of ${slots.length} answered`;
  }
  slotForms.addEventListener("scroll", updatePosition, {passive:true});
  slotForms.addEventListener("change", updateProgress);
  document.getElementById("prevSlotBtn").onclick = () => goToCard(activeIndex() - 1);
  document.getElementById("nextSlotBtn").onclick = () => goToCard(activeIndex() + 1);
  updatePosition(); updateProgress();

  if (closed) return;

  const firstInput = document.getElementById("participantFirst");
  const lastInput = document.getElementById("participantLast");
  const nameError = document.getElementById("nameError");
  const matchNotice = document.getElementById("matchNotice");
  const manualLinkBlock = document.getElementById("manualLinkBlock");

  function checkNameMatch() {
    const first = firstInput.value.trim();
    const last = lastInput.value.trim();
    nameError.style.display = "none";
    matchNotice.innerHTML = "";
    manualLinkBlock.style.display = "none";

    if (!first && !last) return;
    if (!first || !last) return; // wait until both are filled before matching

    const value = `${first} ${last}`;
    const exact = mustAttend.find((m) => normalizeName(m) === normalizeName(value));
    if (exact) {
      matchNotice.innerHTML = `<span style="color:var(--teal);">✓ Matched to Must-Attend participant <strong>${escapeHtml(exact)}</strong>.</span>`;
    } else if (mustAttend.length > 0) {
      matchNotice.innerHTML = `<span style="color:var(--ink-faint);">No exact Must-Attend match.</span>`;
      manualLinkBlock.style.display = "block";
    }
  }
  firstInput.addEventListener("input", checkNameMatch);
  lastInput.addEventListener("input", checkNameMatch);

  document.getElementById("submitBtn").addEventListener("click", submitResponse);
}

async function submitResponse() {
  const submitError = document.getElementById("submitError");
  submitError.style.display = "none";

  const first = document.getElementById("participantFirst").value.trim();
  const last = document.getElementById("participantLast").value.trim();

  if (!first || !last) {
    submitError.textContent = "Enter both your first and last name.";
    submitError.style.display = "block";
    return;
  }
  const name = `${first} ${last}`.replace(/\s+/g, " ");

  const responses = {};
  for (const slot of pollData.slots) {
    const checked = document.querySelector(`input[name="resp-${slot.id}"]:checked`);
    if (!checked) {
      submitError.textContent = `Please answer for ${formatViewerLocal(slot.iso)}.`;
      submitError.style.display = "block";
      document.querySelector(`.slot-card[data-slot-id="${slot.id}"]`)?.scrollIntoView({behavior:"smooth", block:"center", inline:"start"});
      return;
    }
    responses[slot.id] = checked.value;
  }

  const manualLinkSelect = document.getElementById("manualLinkSelect");
  const manualLink = manualLinkSelect ? manualLinkSelect.value : "";

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting…";

  try {
    const res = await fetch("/api/submit-response", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pollId, participantName: name, responses, manualLink }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not submit response.");

    const successMsg = document.getElementById("successMsg");
    successMsg.style.display = "block";
    successMsg.textContent = data.linkedMustAttend
      ? `✓ Response recorded, linked as Must-Attend participant "${data.linkedMustAttend}".`
      : "✓ Response recorded. Thank you!";
    submitBtn.textContent = "Submitted";
    try {
      const latest = await fetch(`/api/get-poll?id=${encodeURIComponent(pollId)}`, {cache:"no-store"});
      if (latest.ok) { pollData = await latest.json(); renderGroupCounts(true); }
    } catch (_) { /* The response was saved; counts can be refreshed later. */ }
  } catch (err) {
    submitError.textContent = err.message;
    submitError.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit response";
  }
}

// ---------------- Organizer view ----------------
function countLabel(count) {
  const total = count.yes + count.ifNeeded + count.no;
  return total ? `<span class="yes">${count.yes} Yes</span><span class="ifn">${count.ifNeeded} Maybe</span><span class="no">${count.no} No</span>` : "No responses yet";
}
function renderGroupCounts(showOverview = false) {
  if (!pollData.showGroupCounts || !pollData.groupCounts) return;
  for (const slot of pollData.slots) {
    const target = document.querySelector(`[data-count-slot="${CSS.escape(slot.id)}"]`);
    if (target) target.innerHTML = `<small>Group availability so far</small><div>${countLabel(pollData.groupCounts[slot.id] || {yes:0, ifNeeded:0, no:0})}</div>`;
  }
  if (!showOverview) return;
  const overview = document.getElementById("groupOverview");
  if (!overview) return;
  const ordered = [...pollData.slots].sort((a,b) => {
    const x = pollData.groupCounts[a.id], y = pollData.groupCounts[b.id];
    return (2*y.yes+y.ifNeeded) - (2*x.yes+x.ifNeeded) || Date.parse(a.iso)-Date.parse(b.iso);
  });
  overview.innerHTML = `<h2>Group availability so far</h2><p>Current responses, ranked by Yes and Maybe votes. The organizer chooses the final time.</p><ol>${ordered.map(s => `<li><strong>${escapeHtml(formatViewerLocal(s.iso))}</strong><div class="group-count">${countLabel(pollData.groupCounts[s.id])}</div></li>`).join("")}</ol>`;
}
function renderOrganizerView() {
  const { title, slots, participants } = pollData;

  app.innerHTML = `
    <div class="masthead">
      <div class="eyebrow">Organizer view<span class="beta-tag">Beta</span></div>
      <h1>${escapeHtml(title)}</h1>
      <p class="sub">Times shown in your timezone (${escapeHtml(viewerTimezone())}).</p>
    </div>

    <div id="decisionSummary" class="decision-summary" aria-live="polite"></div>

    <div class="ruled-section">
      <h2>Share this poll</h2>
      <p class="desc">Give participants the response link. This organizer link opens the results and controls; keep it to yourself.</p>
      <div class="share-actions"><button class="ghost" id="copyParticipantLink" type="button">Copy participant link</button><button class="ghost" id="copyOrganizerLink" type="button">Copy organizer link</button><button class="ghost" id="emailSelfLink" type="button">✉ Email link to myself</button></div>
      <details class="help-details"><summary>How do links and reminders work?</summary>
        <div class="help-grid">
          <p><strong>Participant link</strong><br>Send this in your own email or group chat. People enter their names and availability. They can see group totals when enabled, but not the named response table.</p>
          <p><strong>Organizer link</strong><br>Only someone with this private link can view all responses or manage the poll. It is saved in this browser, but email or bookmark it for use on another device. A lost link cannot be recovered.</p>
          <p><strong>Reminder</strong><br>When a Must-Attend person has not replied, use the buttons below to copy a ready-to-paste message or open an email draft. You choose the recipients. Corral does not collect email addresses or send the message itself.</p>
        </div>
      </details>
      <div id="reminderControls"></div>
    </div>
    <details class="manage-details">
      <summary><span><strong>Manage poll</strong><small>Deadline, Must-Attend people, and proposed times</small></span><span class="manage-chevron" aria-hidden="true">⌄</span></summary>
    <div class="ruled-section">
      <h2>Group availability</h2>
      <p class="desc">Show Yes, Maybe, and No totals to participants as they vote. Individual names stay private.</p>
      <label class="group-setting"><input type="checkbox" id="showGroupCounts" ${pollData.showGroupCounts ? "checked" : ""}> Show group counts to participants</label>
    </div>
    <div class="ruled-section">
      <h2>Response deadline</h2>
      <p class="desc">After this passes, participants can't submit or change responses.</p>
      <div id="deadlineControls"></div>
    </div>

    <div class="ruled-section">
      <h2>Must-Attend participants</h2>
      <p class="desc">The meeting should not be scheduled when a Must-Attend participant is unavailable.</p>
      <div class="chips" id="mustAttendChips"></div>
      <div class="row">
        <input type="text" id="mustAttendFirst" placeholder="First name">
        <input type="text" id="mustAttendLast" placeholder="Last name">
        <button class="ghost" id="addMustAttendBtn" type="button">Add</button>
      </div>
      <div class="field-error" id="mustAttendError" style="display:none;"></div>
    </div>

    <div class="ruled-section"><h2>Propose another time</h2><p class="desc">Existing responses stay intact. Participants can answer the new time by submitting again.</p><div class="row"><input type="datetime-local" id="newSlotInput"><button class="ghost" id="addTimeBtn" type="button">Add time</button></div></div>
    </details>

    <div class="ruled-section">
      <h2>Responses</h2>
      <p class="desc">Who said what, at a glance. MUST tags mark Must-Attend participants.</p>
      <div id="rosterGrid"></div>
    </div>

    <div class="ruled-section" style="border-bottom:none; padding-bottom:0;">
      <h2>Recommendations</h2>
      <p class="desc">Compare the times and lock one in when you're ready.</p>
      <details class="ranking-help"><summary>How are times ranked?</summary><p>Yes counts twice and Maybe counts once. A Must-Attend No rules out a recommendation; missing Must-Attend answers keep it provisional. Equal scores share the same badge. You can still finalize any time.</p></details>
      <div id="slotList"></div>
    </div>

    <p class="footnote">
      You can select any time regardless of the recommendation shown above — recommendations
      are a guide, the final scheduling decision is always yours.
    </p>
  `;

  renderDeadlineControls();
  renderMustAttendChips();
  renderResults();
  const participantLink = `${location.origin}/poll.html?id=${encodeURIComponent(pollId)}`;
  document.getElementById("showGroupCounts").addEventListener("change", async event => {
    const checkbox = event.currentTarget;
    checkbox.disabled = true;
    try { const updated = await updatePoll({showGroupCounts:checkbox.checked}); pollData.showGroupCounts = updated.showGroupCounts; }
    catch (err) { checkbox.checked = !checkbox.checked; saveError(err); }
    finally { checkbox.disabled = false; }
  });
  document.getElementById("copyParticipantLink").onclick = event => copyWithFeedback(event.currentTarget, participantLink);
  document.getElementById("copyOrganizerLink").onclick = event => copyWithFeedback(event.currentTarget, location.href);
  document.getElementById("emailSelfLink").onclick = () => mailDraft("My private Corral organizer link", `Keep this private link to manage “${pollData.title}”:\n\n${location.href}`);
  document.getElementById("addTimeBtn").onclick = async () => {
    const input = document.getElementById("newSlotInput");
    if (!input.value) return;
    try { const updated = await updatePoll({addSlots:[{iso:new Date(input.value).toISOString()}]});
      pollData.slots = updated.slots; input.value = ""; renderOrganizerView();
    } catch (err) { saveError(err); }
  };

  document.getElementById("addMustAttendBtn").addEventListener("click", addMustAttend);
  ["mustAttendFirst", "mustAttendLast"].forEach((id) => {
    document.getElementById(id).addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); addMustAttend(); }
    });
  });

  function renderDeadlineControls() {
    const el = document.getElementById("deadlineControls");
    const hasDeadline = !!pollData.deadlineIso;
    el.innerHTML = `
      <div class="row" style="align-items:center;">
        <input type="datetime-local" id="deadlineInput" style="flex:1;" value="${hasDeadline ? toLocalInputValue(pollData.deadlineIso) : ""}">
        <button class="ghost" id="saveDeadlineBtn" type="button">${hasDeadline ? "Update" : "Set deadline"}</button>
        ${hasDeadline ? '<button class="ghost" id="clearDeadlineBtn" type="button">Clear</button>' : ""}
      </div>
      ${hasDeadline ? `<div style="margin-top:8px; font-size:13px; color:${isPastDeadline(pollData.deadlineIso) ? "var(--amber)" : "var(--ink-faint)"};">${isPastDeadline(pollData.deadlineIso) ? "Closed since" : "Open until"} ${escapeHtml(formatViewerLocal(pollData.deadlineIso))}</div>` : ""}
    `;
    document.getElementById("saveDeadlineBtn").addEventListener("click", async () => {
      const val = document.getElementById("deadlineInput").value;
      if (!val) return;
      const iso = new Date(val).toISOString();
      try { await updatePoll({ deadlineIso: iso }); } catch (err) { saveError(err); return; }
      pollData.deadlineIso = iso;
      renderDeadlineControls();
    });
    const clearBtn = document.getElementById("clearDeadlineBtn");
    if (clearBtn) {
      clearBtn.addEventListener("click", async () => {
        try { await updatePoll({ deadlineIso: "" }); } catch (err) { saveError(err); return; }
        pollData.deadlineIso = null;
        renderDeadlineControls();
      });
    }
  }

  function toLocalInputValue(iso) {
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function renderMustAttendChips() {
    const el = document.getElementById("mustAttendChips");
    if (pollData.mustAttend.length === 0) {
      el.innerHTML = '<span class="empty-note">No Must-Attend participants set.</span>';
      return;
    }
    el.innerHTML = pollData.mustAttend.map((name) => `
      <span class="chip">
        <span class="name">${escapeHtml(name)}</span>
        <span class="tag">MUST ATTEND</span>
        <button type="button" data-remove-ma="${escapeHtml(name)}">×</button>
      </span>
    `).join("");
    el.querySelectorAll("[data-remove-ma]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const name = btn.getAttribute("data-remove-ma");
        const next = pollData.mustAttend.filter((m) => m !== name);
        try { await updatePoll({mustAttend:next}); } catch (err) { saveError(err); return; }
        pollData.mustAttend = next;
        renderMustAttendChips();
        renderResults();
      });
    });
  }

  async function addMustAttend() {
    const firstInput = document.getElementById("mustAttendFirst");
    const lastInput = document.getElementById("mustAttendLast");
    const error = document.getElementById("mustAttendError");
    const first = firstInput.value.trim();
    const last = lastInput.value.trim();
    error.style.display = "none";
    if (!first && !last) return;
    if (!first || !last) {
      error.textContent = "Enter both a first and last name.";
      error.style.display = "block";
      return;
    }
    const fullName = `${first} ${last}`.replace(/\s+/g, " ");
    if (pollData.mustAttend.some((m) => m.toLowerCase() === fullName.toLowerCase())) {
      error.textContent = "This person is already on the Must-Attend list.";
      error.style.display = "block";
      return;
    }
    const next = [...pollData.mustAttend, fullName];
    try { await updatePoll({mustAttend:next}); } catch (err) { saveError(err); return; }
    pollData.mustAttend = next;
    firstInput.value = "";
    lastInput.value = "";
    firstInput.focus();
    renderMustAttendChips();
    renderResults();
  }

  async function finalizeSlot(slotId) {
    try { await updatePoll({finalizedSlotId:slotId}); } catch (err) { saveError(err); return; }
    pollData.finalizedSlotId = slotId;
    renderResults();
  }

  async function unfinalize() {
    try { await updatePoll({finalizedSlotId:""}); } catch (err) { saveError(err); return; }
    pollData.finalizedSlotId = null;
    renderResults();
  }

  function ansIconHtml(response) {
    if (response === "yes") return `<span class="ans-icon yes" title="Yes">✓</span>`;
    if (response === "if_needed") return `<span class="ans-icon maybe" title="Maybe">~</span>`;
    if (response === "no") return `<span class="ans-icon no" title="No">✕</span>`;
    return `<span class="ans-icon none" title="No response yet">·</span>`;
  }

  function renderRosterGrid() {
    const el = document.getElementById("rosterGrid");
    const { slots, participants, responses, mustAttend, linkedMustAttend } = pollData;

    if (participants.length === 0) {
      el.innerHTML = '<div class="empty-note">No responses yet.</div>';
      return;
    }
    if (slots.length === 0) {
      el.innerHTML = '<div class="empty-note">No proposed times yet.</div>';
      return;
    }

    // Must-Attend participants first, then everyone else alphabetically.
    const sortedParticipants = [...participants].sort((a, b) => {
      const aMust = !!linkedMustAttend[a];
      const bMust = !!linkedMustAttend[b];
      if (aMust !== bMust) return aMust ? -1 : 1;
      return a.localeCompare(b);
    });

    const totals = slots.map((slot) => tally(slot.id, responses, participants));

    const headerCells = slots.map((s) => `<th>${escapeHtml(formatViewerLocal(s.iso))}</th>`).join("");

    const bodyRows = sortedParticipants.map((name) => {
      const linked = linkedMustAttend[name];
      const cells = slots.map((slot) => `<td>${ansIconHtml(responses[name] && responses[name][slot.id])}</td>`).join("");
      return `
        <tr>
          <td class="name-col">
            <div class="roster-name">
              <span>${escapeHtml(name)}</span>
              ${linked ? '<span class="roster-must-tag">MUST</span>' : ""}
            </div>
          </td>
          ${cells}
        </tr>
      `;
    }).join("");

    const totalYesRow = `<td class="name-col">Yes</td>` + totals.map((t) => `<td>${t.yes}</td>`).join("");
    const totalMaybeRow = `<td class="name-col">Maybe</td>` + totals.map((t) => `<td>${t.ifNeeded}</td>`).join("");
    const totalNoRow = `<td class="name-col">No</td>` + totals.map((t) => `<td>${t.no}</td>`).join("");

    el.innerHTML = `
      <div class="grid-wrap">
        <table class="roster">
          <thead><tr><th class="name-col">Participant</th>${headerCells}</tr></thead>
          <tbody>${bodyRows}</tbody>
          <tfoot>
            <tr>${totalYesRow}</tr>
            <tr>${totalMaybeRow}</tr>
            <tr>${totalNoRow}</tr>
          </tfoot>
        </table>
      </div>
    `;

  }

  function renderReminderControls() {
    const el = document.getElementById("reminderControls");
    const linked = new Set(Object.values(pollData.linkedMustAttend).filter(Boolean).map(normalizeName));
    const missing = pollData.mustAttend.filter(name => !linked.has(normalizeName(name)));
    el.replaceChildren();
    if (!missing.length) return;
    const box = document.createElement("div"); box.className = "reminder-box";
    const title = document.createElement("strong"); title.textContent = `Awaiting: ${missing.join(", ")}`;
    const note = document.createElement("p"); note.textContent = "Send a reminder using your own email app, or copy the message into a group chat. Add recipients yourself.";
    const actions = document.createElement("div"); actions.className = "share-actions";
    const copy = document.createElement("button"); copy.type = "button"; copy.className = "ghost"; copy.textContent = "Copy reminder message";
    copy.onclick = () => copyWithFeedback(copy, reminderText(missing));
    const email = document.createElement("button"); email.type = "button"; email.className = "ghost"; email.textContent = "✉ Open email draft";
    email.onclick = () => mailDraft(`Reminder: ${pollData.title}`, reminderText(missing));
    actions.append(copy, email); box.append(title, note, actions); el.append(box);
  }

  function renderDecisionSummary(rec) {
    const el = document.getElementById("decisionSummary");
    const count = pollData.participants.length;
    const tally = rec.recommended ? rec.recommended.tally : null;
    const finalized = pollData.slots.find(slot => slot.id === pollData.finalizedSlotId);
    let label, title, description, tone = "info";
    if (finalized) {
      label = "Meeting confirmed";
      title = formatViewerLocal(finalized.iso);
      description = "This time is locked in. You can undo it from the time card below.";
      tone = "ok";
    } else if (count === 0) {
      label = "Waiting for responses";
      title = "Your poll is ready to share";
      description = "Copy the participant link below. Results will appear here as people respond.";
    } else if (rec.pending) {
      label = "Leading so far";
      title = rec.bestCompromise ? formatViewerLocal(rec.bestCompromise.iso) : "Awaiting responses";
      description = "Some Must-Attend answers are still missing, so there is no recommendation yet.";
    } else if (rec.noFullyEligible) {
      label = "Decision needed";
      title = "No time fits everyone essential";
      description = "Review the conflicts below or propose another time in Manage poll.";
      tone = "warn";
    } else if (rec.recommended) {
      label = pollData.mustAttend.length ? "Recommended time" : "Best overall time";
      title = formatViewerLocal(rec.recommended.iso);
      description = `${tally.yes} Yes · ${tally.ifNeeded} Maybe · ${tally.no} No${pollData.mustAttend.length ? " · All Must-Attend people answered Yes or Maybe" : ""}`;
      tone = "ok";
    } else {
      label = "Responses received";
      title = "Review the times below";
      description = "No time has been recommended yet.";
    }
    el.className = `decision-summary ${tone}`;
    el.innerHTML = `<div class="decision-kicker">${escapeHtml(label)}</div><div class="decision-title">${escapeHtml(title)}</div><p>${escapeHtml(description)}</p><div class="decision-footer"><span>${count} participant${count === 1 ? "" : "s"} responded · ${pollData.slots.length} proposed time${pollData.slots.length === 1 ? "" : "s"}</span><a href="#rosterGrid">View responses ↓</a></div>`;
  }

  function renderResults() {
    const rec = computeRecommendations(
      pollData.slots,
      pollData.responses,
      pollData.participants,
      pollData.mustAttend,
      pollData.linkedMustAttend
    );

    renderRosterGrid();
    renderReminderControls();

    renderDecisionSummary(rec);

    const slotList = document.getElementById("slotList");
    if (pollData.slots.length === 0) {
      slotList.innerHTML = '<div class="empty-note">No proposed times yet.</div>';
      return;
    }

    slotList.innerHTML = rec.withTally.map((slot) => {
      const badges = badgesForSlot(slot, rec, pollData.mustAttend.length);
      const isClosestAlt = rec.noFullyEligible && rec.closestAlternatives.some((a) => a.id === slot.id);
      const isFinalized = pollData.finalizedSlotId === slot.id;

      const badgeHtml = badges.map((b) => `<span class="pill ${b.tone}">${b.label}</span>`).join("") ||
        (isClosestAlt ? `<span class="pill neutral">Closest alternative</span>` : "");

      let mustLine = "";
      if (slot.must.unavailable.length > 0) {
        mustLine = `<div class="must-line warn">⚠ Must-Attend unavailable: <strong>&nbsp;${escapeHtml(slot.must.unavailable.join(", "))}</strong></div>`;
      } else if (slot.must.unknown.length > 0) {
        mustLine = `<div class="must-line" style="color:var(--ink-faint);">Awaiting response from: <strong>&nbsp;${escapeHtml(slot.must.unknown.join(", "))}</strong></div>`;
      } else if (slot.must.conditional.length > 0) {
        mustLine = `<div class="must-line">Conditional (Maybe): <strong>&nbsp;${escapeHtml(slot.must.conditional.join(", "))}</strong></div>`;
      } else if (pollData.mustAttend.length > 0) {
        mustLine = `<div class="must-line ok">✓ All Must-Attend participants said Yes</div>`;
      }

      const actionBtn = isFinalized
        ? `<button class="ghost" data-unfinalize="1" style="border-color:var(--teal); color:var(--teal);">✓ Finalized — undo</button>`
        : `<button class="ghost" data-finalize="${slot.id}">🔒 Finalize this time</button>`;

      return `
        <div class="slot ${isFinalized ? "selected" : ""}">
          <div class="slot-head">
            <div>
              <div class="slot-title serif">${escapeHtml(formatViewerLocal(slot.iso))}</div>
              <div class="stat-row">
                <span class="yes"><strong>${slot.tally.yes}</strong> Yes</span>
                <span class="ifn"><strong>${slot.tally.ifNeeded}</strong> Maybe</span>
                <span class="no"><strong>${slot.tally.no}</strong> No</span>
              </div>
            </div>
            ${actionBtn}
          </div>
          <div class="badges">${badgeHtml}</div>
          ${mustLine}
        </div>
      `;
    }).join("");

    slotList.querySelectorAll("[data-finalize]").forEach((btn) => {
      btn.addEventListener("click", () => finalizeSlot(btn.getAttribute("data-finalize")));
    });
    slotList.querySelectorAll("[data-unfinalize]").forEach((btn) => {
      btn.addEventListener("click", unfinalize);
    });
  }

  // Poll for new responses periodically so the organizer sees live updates.
  if (!window.corralRefreshTimer) window.corralRefreshTimer = setInterval(async () => {
    try {
      const res = await fetch(`/api/get-poll?id=${encodeURIComponent(pollId)}`, {headers: organizerHeaders, cache: "no-store"});
      const data = await res.json();
      if (res.ok) {
        pollData = data;
        renderResults();
      }
    } catch (err) {
      // silent — next interval will retry
    }
  }, 8000);
}
</script>
</body>
</html>
