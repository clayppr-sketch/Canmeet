<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheduling Poll — Corral</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="top-nav">
  <div style="display:flex; align-items:center; gap:16px;">
    <a href="/" class="landing-logo" style="text-decoration:none; font-size:16px;">Corral<span class="beta-tag">Beta</span></a>
    <a href="/" style="font-size:13px;">← New poll</a>
  </div>
  <div class="top-nav-links">
    <a href="#" id="toggleViewLink" style="display:none;"></a>
    <a class="feedback-link" href="/feedback.html">✎ Send feedback</a>
  </div>
</div>
<div class="wrap">
  <div id="app"><div class="loading">Loading poll…</div></div>
</div>

<script src="/logic.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
const pollId = params.get("id");
const organizerToken = hashParams.get("organizer") || "";
const isOrganizer = !!organizerToken;
const legacyOrganizerFlag = params.get("organizer") === "1" && !organizerToken;
const RECENT_POLLS_KEY = "corral_recent_organizer_links_v2";

const app = document.getElementById("app");
const toggleLink = document.getElementById("toggleViewLink");
let pollData = null;
let organizerPollTimer = null;

function participantUrl() {
  return `${window.location.origin}/poll.html?id=${encodeURIComponent(pollId)}`;
}
function organizerUrl() {
  return `${window.location.origin}/poll.html?id=${encodeURIComponent(pollId)}#organizer=${encodeURIComponent(organizerToken)}`;
}
function organizerHeaders(extra = {}) {
  return { ...extra, "X-Organizer-Token": organizerToken };
}
async function readJsonResponse(res, fallback) {
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.error || fallback);
  return data;
}

function saveOrganizerLinkLocally() {
  if (!isOrganizer || !pollData) return;
  try {
    const existing = JSON.parse(localStorage.getItem(RECENT_POLLS_KEY) || "[]");
    const list = Array.isArray(existing) ? existing : [];
    const prior = list.find((p) => p.pollId === pollId);
    const record = {
      pollId,
      title: pollData.title,
      organizerUrl: organizerUrl(),
      respondUrl: participantUrl(),
      createdAt: prior && prior.createdAt ? prior.createdAt : new Date().toISOString(),
    };
    const next = [record, ...list.filter((p) => p.pollId !== pollId)].slice(0, 20);
    localStorage.setItem(RECENT_POLLS_KEY, JSON.stringify(next));
  } catch {}
}

async function fetchPollData() {
  const headers = isOrganizer ? organizerHeaders() : {};
  const res = await fetch(`/api/get-poll?id=${encodeURIComponent(pollId)}`, { headers });
  return readJsonResponse(res, "Could not load poll.");
}

async function organizerMutation(payload) {
  const res = await fetch("/api/update-poll", {
    method: "POST",
    headers: organizerHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify({ pollId, ...payload }),
  });
  return readJsonResponse(res, "Could not update poll.");
}

function openMailDraft(subject, body) {
  window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function invitationText() {
  const deadlineLine = pollData.deadlineIso ? `\nPlease respond by ${formatViewerLocal(pollData.deadlineIso)}.` : "";
  return `Hi,\n\nPlease add your availability for “${pollData.title}”.${deadlineLine}\n\n${participantUrl()}\n\nNo account or email is required.`;
}

function joinNames(names) {
  if (names.length <= 1) return names[0] || "";
  if (names.length === 2) return `${names[0]} and ${names[1]}`;
  return `${names.slice(0, -1).join(", ")}, and ${names[names.length - 1]}`;
}

function reminderText(names) {
  const deadlineLine = pollData.deadlineIso && !isPastDeadline(pollData.deadlineIso)
    ? `\n\nPlease respond by ${formatViewerLocal(pollData.deadlineIso)}.`
    : "";
  return `Hi ${joinNames(names)},\n\nA quick reminder to add your availability for “${pollData.title}”. It should take about a minute.${deadlineLine}\n\n${participantUrl()}\n\nThank you.`;
}

if (!pollId) {
  app.innerHTML = '<div class="error-state">No poll id given. Use the link you were sent.</div>';
} else if (legacyOrganizerFlag) {
  app.innerHTML = `
    <div class="banner warn">
      <div class="title">This is an older organizer link</div>
      <div class="body">The previous <code>?organizer=1</code> link was not private enough and is no longer accepted for organizer access. The participant poll still exists, but this old link cannot securely prove organizer ownership.</div>
    </div>
    <p><a href="${escapeAttr(participantUrl())}">Open the participant view →</a></p>`;
} else {
  if (isOrganizer) {
    toggleLink.style.display = "inline";
    toggleLink.textContent = "View as participant";
    toggleLink.href = participantUrl();
  }
  loadPoll();
}

async function loadPoll() {
  try {
    pollData = await fetchPollData();
    if (isOrganizer && !pollData.isOrganizer) throw new Error("Organizer authorization failed.");
    if (isOrganizer) {
      saveOrganizerLinkLocally();
      renderOrganizerView();
      startOrganizerPolling();
    } else {
      renderParticipantView();
    }
  } catch (err) {
    app.innerHTML = `<div class="error-state">${escapeHtml(err.message)}</div>`;
  }
}

function deadlineBanner() {
  if (pollData.finalizedSlotId || !pollData.deadlineIso) return "";
  const passed = isPastDeadline(pollData.deadlineIso);
  const localDeadline = formatViewerLocal(pollData.deadlineIso);
  if (passed) {
    return `<div class="banner warn"><div class="title">Responses closed</div><div class="body">The response deadline (${escapeHtml(localDeadline)}) has passed.</div></div>`;
  }
  return `<div class="banner info"><div class="title">Open until ${escapeHtml(localDeadline)}</div><div class="body">Responses submitted after this time won't be counted.</div></div>`;
}

function finalizedBanner(slots) {
  if (!pollData.finalizedSlotId) return "";
  const slot = slots.find((s) => s.id === pollData.finalizedSlotId);
  if (!slot) return "";
  return `<div class="banner ok"><div class="title">✓ Meeting confirmed: ${escapeHtml(formatViewerLocal(slot.iso))}</div><div class="body">The organizer has locked in this time.</div></div>`;
}

// ---------------- Participant view ----------------
function renderParticipantView() {
  const { title, slots, mustAttend } = pollData;
  const closed = !!pollData.finalizedSlotId || isPastDeadline(pollData.deadlineIso);
  const mustOptions = mustAttend.map((m) => `<option value="${escapeAttr(m)}">Yes — I'm ${escapeHtml(m)}</option>`).join("");

  app.innerHTML = `
    <div class="masthead">
      <div class="eyebrow">Scheduling poll<span class="beta-tag">Beta</span></div>
      <h1>${escapeHtml(title)}</h1>
      <p class="sub">Let us know your availability for each proposed time. Times below are shown in your local timezone (${escapeHtml(viewerTimezone())}).</p>
    </div>
    ${finalizedBanner(slots)}
    ${deadlineBanner()}
    <div class="panel" id="formPanel" style="${closed ? "opacity:0.6;" : ""}">
      <div class="field-block">
        <label class="field-label">Your name</label>
        <div class="row">
          <input type="text" id="participantFirst" placeholder="First name" ${closed ? "disabled" : ""}>
          <input type="text" id="participantLast" placeholder="Last name" ${closed ? "disabled" : ""}>
        </div>
        <div class="field-error" id="nameError" style="display:none;"></div>
        <div id="matchNotice" style="margin-top:8px; font-size:13.5px;"></div>
        <div id="manualLinkBlock" style="display:none; margin-top:8px;">
          <label class="field-label" style="font-weight:500;">Are you one of the Must-Attend participants under a different spelling?</label>
          <select id="manualLinkSelect">
            <option value="">No — I'm a regular participant</option>
            ${mustOptions}
          </select>
          <div class="desc" style="margin-top:6px;">This is trust-based: Corral does not use accounts or email verification.</div>
        </div>
      </div>
      <div id="slotForms"></div>
      <div class="field-error" id="submitError" style="display:none; margin-bottom:12px;"></div>
      <button class="primary" id="submitBtn" type="button" ${closed ? "disabled" : ""}>${closed ? "Responses closed" : "Submit response"}</button>
      <div id="successMsg" style="display:none; margin-top:14px; color:var(--teal); font-size:14px;"></div>
    </div>`;

  const slotForms = document.getElementById("slotForms");
  slots.forEach((slot) => {
    const block = document.createElement("div");
    block.className = "field-block";
    block.innerHTML = `
      <label class="field-label">${escapeHtml(formatViewerLocal(slot.iso))}</label>
      <div class="radio-group">
        <label class="radio-option"><input type="radio" name="resp-${escapeAttr(slot.id)}" value="yes" ${closed ? "disabled" : ""}> Yes</label>
        <label class="radio-option"><input type="radio" name="resp-${escapeAttr(slot.id)}" value="if_needed" ${closed ? "disabled" : ""}> Maybe</label>
        <label class="radio-option"><input type="radio" name="resp-${escapeAttr(slot.id)}" value="no" ${closed ? "disabled" : ""}> No</label>
      </div>`;
    slotForms.appendChild(block);
  });

  if (closed) return;

  const firstInput = document.getElementById("participantFirst");
  const lastInput = document.getElementById("participantLast");
  const matchNotice = document.getElementById("matchNotice");
  const manualLinkBlock = document.getElementById("manualLinkBlock");

  function checkNameMatch() {
    const first = firstInput.value.trim();
    const last = lastInput.value.trim();
    matchNotice.innerHTML = "";
    manualLinkBlock.style.display = "none";
    if (!first || !last) return;
    const value = `${first} ${last}`;
    const exact = mustAttend.find((m) => normalizeName(m) === normalizeName(value));
    if (exact) {
      matchNotice.innerHTML = `<span style="color:var(--teal);">✓ Matched to Must-Attend participant <strong>${escapeHtml(exact)}</strong>.</span>`;
    } else if (mustAttend.length > 0) {
      matchNotice.innerHTML = `<span style="color:var(--ink-faint);">No exact Must-Attend match.</span>`;
      manualLinkBlock.style.display = "block";
    }
  }
  firstInput.addEventListener("input", checkNameMatch);
  lastInput.addEventListener("input", checkNameMatch);
  document.getElementById("submitBtn").addEventListener("click", submitResponse);
}

async function submitResponse() {
  const submitError = document.getElementById("submitError");
  submitError.style.display = "none";
  const first = document.getElementById("participantFirst").value.trim();
  const last = document.getElementById("participantLast").value.trim();
  if (!first || !last) {
    submitError.textContent = "Enter both your first and last name.";
    submitError.style.display = "block";
    return;
  }
  const name = `${first} ${last}`.replace(/\s+/g, " ");
  const responses = {};
  for (const slot of pollData.slots) {
    const checked = document.querySelector(`input[name="resp-${CSS.escape(slot.id)}"]:checked`);
    if (!checked) {
      submitError.textContent = `Please answer for ${formatViewerLocal(slot.iso)}.`;
      submitError.style.display = "block";
      return;
    }
    responses[slot.id] = checked.value;
  }
  const manualLinkSelect = document.getElementById("manualLinkSelect");
  const manualLink = manualLinkSelect ? manualLinkSelect.value : "";
  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting…";

  try {
    const res = await fetch("/api/submit-response", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pollId, participantName: name, responses, manualLink }),
    });
    const data = await readJsonResponse(res, "Could not submit response.");
    const successMsg = document.getElementById("successMsg");
    successMsg.style.display = "block";
    successMsg.textContent = data.linkedMustAttend
      ? `✓ Response recorded, linked as Must-Attend participant “${data.linkedMustAttend}”. You can change an answer and submit again.`
      : "✓ Response recorded. You can change an answer and submit again if needed.";
    submitBtn.disabled = false;
    submitBtn.textContent = "Update response";
  } catch (err) {
    submitError.textContent = err.message;
    submitError.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit response";
  }
}

// ---------------- Organizer view ----------------
function renderOrganizerView() {
  const { title, slots, participants } = pollData;
  app.innerHTML = `
    <div class="masthead">
      <div class="eyebrow">Organizer view<span class="beta-tag">Beta</span></div>
      <h1>${escapeHtml(title)}</h1>
      <p class="sub" id="participantSummary">${participants.length} participant${participants.length === 1 ? "" : "s"} have responded across ${slots.length} proposed time${slots.length === 1 ? "" : "s"}. Times shown in your timezone (${escapeHtml(viewerTimezone())}).</p>
    </div>

    <div class="panel organizer-access-panel">
      <h2 class="serif" style="margin-top:0;">Links & sharing</h2>
      <p class="desc">The participant link is safe to share. Keep the organizer link private — possession of it is what authorizes changes.</p>
      <div class="field-block">
        <label class="field-label">Participant link</label>
        <div class="link-box"><input id="participantShareLink" readonly value="${escapeAttr(participantUrl())}"><button class="ghost" id="copyParticipantLinkBtn" type="button">Copy link</button></div>
        <div class="button-row" style="margin-top:8px;"><button class="ghost" id="copyInvitationBtn" type="button">📋 Copy invitation</button><button class="ghost" id="emailInvitationBtn" type="button">✉ Open email draft</button></div>
      </div>
      <div class="field-block" style="margin-bottom:0;">
        <label class="field-label">Private organizer link</label>
        <div class="link-box"><input id="privateOrganizerLink" readonly value="${escapeAttr(organizerUrl())}"><button class="ghost" id="copyPrivateLinkBtn" type="button">Copy link</button></div>
        <div class="button-row" style="margin-top:8px;"><button class="ghost" id="emailPrivateLinkBtn" type="button">✉ Email to myself</button></div>
        <div class="desc" style="margin-top:7px;">Saved automatically in this browser too. “Email to myself” opens your own mail app; Corral does not receive or store the address.</div>
      </div>
    </div>

    <div id="organizerError" class="field-error" style="display:none; margin-bottom:14px;"></div>
    <div id="finalizedBannerSlot"></div>

    <div class="ruled-section">
      <h2>Response deadline</h2>
      <p class="desc">After this passes, participants can't submit or change responses.</p>
      <div id="deadlineControls"></div>
    </div>

    <div class="ruled-section">
      <h2>Proposed times</h2>
      <p class="desc">Existing times stay fixed once the poll is created so submitted responses keep their meaning. You can add another option.</p>
      <div id="proposedTimesList" style="margin-bottom:10px;"></div>
      <div class="row" style="align-items:center;">
        <input type="datetime-local" id="newSlotInput" style="flex:1;">
        <button class="ghost" id="addSlotOrganizerBtn" type="button">+ Add time</button>
      </div>
    </div>

    <div class="ruled-section">
      <h2>Must-Attend participants</h2>
      <p class="desc">A recommendation is only made after every Must-Attend person's availability is known for that time.</p>
      <div class="chips" id="mustAttendChips"></div>
      <div class="row">
        <input type="text" id="mustAttendFirst" placeholder="First name">
        <input type="text" id="mustAttendLast" placeholder="Last name">
        <button class="ghost" id="addMustAttendBtn" type="button">Add</button>
      </div>
      <div class="field-error" id="mustAttendError" style="display:none;"></div>
    </div>

    <div id="banner"></div>

    <div class="ruled-section">
      <h2>Responses</h2>
      <p class="desc">Individual responses are visible only in this private organizer view.</p>
      <div id="rosterGrid"></div>
    </div>

    <div class="ruled-section" style="border-bottom:none; padding-bottom:0;">
      <h2>Recommendations</h2>
      <p class="desc">Numbers and Must-Attend status are shown alongside the reasoning.</p>
      <div id="slotList"></div>
    </div>

    <p class="footnote">You can select any time regardless of the recommendation — the final scheduling decision is yours.</p>`;

  wireOrganizerShareButtons();
  renderFinalizedBanner();
  renderDeadlineControls();
  renderProposedTimes();
  renderMustAttendChips();
  renderResults();

  document.getElementById("addSlotOrganizerBtn").addEventListener("click", addOrganizerSlot);
  document.getElementById("addMustAttendBtn").addEventListener("click", addMustAttend);
  ["mustAttendFirst", "mustAttendLast"].forEach((id) => {
    document.getElementById(id).addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); addMustAttend(); }
    });
  });
}

function setOrganizerError(message = "") {
  const el = document.getElementById("organizerError");
  if (!el) return;
  el.textContent = message;
  el.style.display = message ? "block" : "none";
}

function wireOrganizerShareButtons() {
  const invite = invitationText();
  const orgLink = organizerUrl();
  document.getElementById("copyParticipantLinkBtn").onclick = () => copyText(participantUrl()).catch(() => window.prompt("Copy this participant link:", participantUrl()));
  document.getElementById("copyInvitationBtn").onclick = () => copyText(invite).catch(() => window.prompt("Copy this invitation:", invite));
  document.getElementById("emailInvitationBtn").onclick = () => openMailDraft(`Availability request: ${pollData.title}`, invite);
  document.getElementById("copyPrivateLinkBtn").onclick = () => copyText(orgLink).catch(() => window.prompt("Copy this private organizer link:", orgLink));
  document.getElementById("emailPrivateLinkBtn").onclick = () => openMailDraft(
    `Private Corral organizer link: ${pollData.title}`,
    `Keep this private link to manage your Corral poll “${pollData.title}”:\n\n${orgLink}\n\nParticipant link:\n${participantUrl()}\n\nThis email is created by your own mail app. Corral does not receive or store your email address.`
  );
}

function renderFinalizedBanner() {
  const el = document.getElementById("finalizedBannerSlot");
  if (el) el.innerHTML = finalizedBanner(pollData.slots);
}

function toLocalInputValue(iso) {
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderDeadlineControls() {
  const el = document.getElementById("deadlineControls");
  if (!el) return;
  const hasDeadline = !!pollData.deadlineIso;
  el.innerHTML = `
    <div class="row" style="align-items:center;">
      <input type="datetime-local" id="deadlineInput" style="flex:1;" value="${hasDeadline ? escapeAttr(toLocalInputValue(pollData.deadlineIso)) : ""}">
      <button class="ghost" id="saveDeadlineBtn" type="button">${hasDeadline ? "Update" : "Set deadline"}</button>
      ${hasDeadline ? '<button class="ghost" id="clearDeadlineBtn" type="button">Clear</button>' : ""}
    </div>
    ${hasDeadline ? `<div style="margin-top:8px; font-size:13px; color:${isPastDeadline(pollData.deadlineIso) ? "var(--amber)" : "var(--ink-faint)"};">${isPastDeadline(pollData.deadlineIso) ? "Closed since" : "Open until"} ${escapeHtml(formatViewerLocal(pollData.deadlineIso))}</div>` : ""}`;

  document.getElementById("saveDeadlineBtn").addEventListener("click", async () => {
    const val = document.getElementById("deadlineInput").value;
    if (!val) return;
    const iso = new Date(val).toISOString();
    if (pollData.slots.some((s) => new Date(iso) >= new Date(s.iso))) {
      setOrganizerError("The response deadline must be before every proposed meeting time.");
      return;
    }
    await mutateAndRefresh({ deadlineIso: iso });
  });
  const clearBtn = document.getElementById("clearDeadlineBtn");
  if (clearBtn) clearBtn.addEventListener("click", () => mutateAndRefresh({ deadlineIso: "" }));
}

function renderProposedTimes() {
  const el = document.getElementById("proposedTimesList");
  if (!el) return;
  el.innerHTML = pollData.slots.map((slot) => `<div style="font-size:13.5px; padding:5px 0; border-bottom:1px solid var(--rule);">${escapeHtml(formatViewerLocal(slot.iso))}</div>`).join("");
}

async function addOrganizerSlot() {
  const input = document.getElementById("newSlotInput");
  const val = input.value;
  if (!val) return;
  const date = new Date(val);
  if (Number.isNaN(date.getTime())) {
    setOrganizerError("Enter a valid proposed time.");
    return;
  }
  const iso = date.toISOString();
  if (pollData.deadlineIso && new Date(pollData.deadlineIso) >= date) {
    setOrganizerError("The response deadline must be before the new proposed time.");
    return;
  }
  await mutateAndRefresh({ addSlots: [{ iso }] });
}

function renderMustAttendChips() {
  const el = document.getElementById("mustAttendChips");
  if (!el) return;
  if (pollData.mustAttend.length === 0) {
    el.innerHTML = '<span class="empty-note">No Must-Attend participants set.</span>';
    return;
  }
  el.innerHTML = pollData.mustAttend.map((name, index) => `
    <span class="chip">
      <span class="name">${escapeHtml(name)}</span>
      <span class="tag">MUST ATTEND</span>
      <button type="button" data-remove-ma-index="${index}" aria-label="Remove ${escapeAttr(name)}">×</button>
    </span>`).join("");
  el.querySelectorAll("[data-remove-ma-index]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const index = Number(btn.getAttribute("data-remove-ma-index"));
      const next = pollData.mustAttend.filter((_, i) => i !== index);
      await mutateAndRefresh({ mustAttend: next });
    });
  });
}

async function addMustAttend() {
  const firstInput = document.getElementById("mustAttendFirst");
  const lastInput = document.getElementById("mustAttendLast");
  const error = document.getElementById("mustAttendError");
  const first = firstInput.value.trim();
  const last = lastInput.value.trim();
  error.style.display = "none";
  if (!first && !last) return;
  if (!first || !last) {
    error.textContent = "Enter both a first and last name.";
    error.style.display = "block";
    return;
  }
  const fullName = `${first} ${last}`.replace(/\s+/g, " ");
  if (pollData.mustAttend.some((m) => normalizeName(m) === normalizeName(fullName))) {
    error.textContent = "This person is already on the Must-Attend list.";
    error.style.display = "block";
    return;
  }
  await mutateAndRefresh({ mustAttend: [...pollData.mustAttend, fullName] });
}

async function mutateAndRefresh(payload) {
  setOrganizerError("");
  try {
    await organizerMutation(payload);
    pollData = await fetchPollData();
    saveOrganizerLinkLocally();
    renderOrganizerView();
  } catch (err) {
    setOrganizerError(err.message);
  }
}

async function finalizeSlot(slotId) {
  await mutateAndRefresh({ finalizedSlotId: slotId });
}
async function unfinalize() {
  await mutateAndRefresh({ finalizedSlotId: "" });
}

function ansIconHtml(response) {
  if (response === "yes") return '<span class="ans-icon yes" title="Yes">✓</span>';
  if (response === "if_needed") return '<span class="ans-icon maybe" title="Maybe">~</span>';
  if (response === "no") return '<span class="ans-icon no" title="No">✕</span>';
  return '<span class="ans-icon none" title="No response yet">·</span>';
}

function renderRosterGrid() {
  const el = document.getElementById("rosterGrid");
  if (!el) return;
  const { slots, participants, responses, mustAttend, linkedMustAttend } = pollData;
  if (participants.length === 0) {
    el.innerHTML = '<div class="empty-note">No responses yet.</div>';
  } else if (slots.length === 0) {
    el.innerHTML = '<div class="empty-note">No proposed times yet.</div>';
  } else {
    const sortedParticipants = [...participants].sort((a, b) => {
      const aMust = !!linkedMustAttend[a];
      const bMust = !!linkedMustAttend[b];
      if (aMust !== bMust) return aMust ? -1 : 1;
      return a.localeCompare(b);
    });
    const totals = slots.map((slot) => tally(slot.id, responses, participants));
    const headerCells = slots.map((s) => `<th>${escapeHtml(formatViewerLocal(s.iso))}</th>`).join("");
    const bodyRows = sortedParticipants.map((name) => {
      const linked = linkedMustAttend[name];
      const cells = slots.map((slot) => `<td>${ansIconHtml(responses[name] && responses[name][slot.id])}</td>`).join("");
      return `<tr><td class="name-col"><div class="roster-name"><span>${escapeHtml(name)}</span>${linked ? '<span class="roster-must-tag">MUST</span>' : ""}</div></td>${cells}</tr>`;
    }).join("");
    el.innerHTML = `
      <div class="grid-wrap"><table class="roster">
        <thead><tr><th class="name-col">Participant</th>${headerCells}</tr></thead>
        <tbody>${bodyRows}</tbody>
        <tfoot>
          <tr><td class="name-col">Yes</td>${totals.map((t) => `<td>${t.yes}</td>`).join("")}</tr>
          <tr><td class="name-col">Maybe</td>${totals.map((t) => `<td>${t.ifNeeded}</td>`).join("")}</tr>
          <tr><td class="name-col">No</td>${totals.map((t) => `<td>${t.no}</td>`).join("")}</tr>
        </tfoot>
      </table></div>`;
  }

  const linkedNames = new Set(Object.values(linkedMustAttend || {}).filter(Boolean).map(normalizeName));
  const notYetResponded = mustAttend.filter((m) => !linkedNames.has(normalizeName(m)));
  if (notYetResponded.length > 0) {
    const box = document.createElement("div");
    box.className = "roster-pending reminder-box";
    box.style.marginTop = "10px";
    box.innerHTML = `<div><strong>Awaiting Must-Attend:</strong> ${escapeHtml(notYetResponded.join(", "))}</div>`;
    const actions = document.createElement("div");
    actions.className = "button-row";
    actions.style.marginTop = "8px";
    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "ghost";
    copyBtn.textContent = "📋 Copy reminder text";
    const emailBtn = document.createElement("button");
    emailBtn.type = "button";
    emailBtn.className = "ghost";
    emailBtn.textContent = "✉ Open email draft";
    const note = document.createElement("span");
    note.style.cssText = "display:none; color:var(--teal); font-size:12.5px; align-self:center;";
    note.textContent = "Copied";
    const message = reminderText(notYetResponded);
    copyBtn.addEventListener("click", () => {
      copyText(message).then(() => {
        note.style.display = "inline";
        setTimeout(() => { note.style.display = "none"; }, 2200);
      }).catch(() => window.prompt("Copy this reminder:", message));
    });
    emailBtn.addEventListener("click", () => openMailDraft(`Reminder: availability for ${pollData.title}`, message));
    actions.append(copyBtn, emailBtn, note);
    box.appendChild(actions);
    el.appendChild(box);
  }
}

function renderResults() {
  const rec = computeRecommendations(
    pollData.slots,
    pollData.responses,
    pollData.participants,
    pollData.mustAttend,
    pollData.linkedMustAttend
  );
  renderRosterGrid();

  const summary = document.getElementById("participantSummary");
  if (summary) summary.textContent = `${pollData.participants.length} participant${pollData.participants.length === 1 ? "" : "s"} have responded across ${pollData.slots.length} proposed time${pollData.slots.length === 1 ? "" : "s"}. Times shown in your timezone (${viewerTimezone()}).`;

  const banner = document.getElementById("banner");
  if (!banner) return;
  if (pollData.finalizedSlotId || pollData.slots.length === 0) {
    banner.innerHTML = "";
  } else if (rec.awaitingMustAttend) {
    const leaders = rec.provisionalChoices.map((s) => formatViewerLocal(s.iso));
    const leaderLine = leaders.length === 1
      ? `Current leading option: <strong>${escapeHtml(leaders[0])}</strong>.`
      : `Current leaders are tied: <strong>${escapeHtml(leaders.join("; "))}</strong>.`;
    banner.innerHTML = `<div class="banner info"><div class="title">Waiting for Must-Attend responses before making a recommendation.</div><div class="body">${leaderLine} This is provisional until the remaining essential participants respond.</div></div>`;
  } else if (rec.noFullyEligible) {
    banner.innerHTML = `<div class="banner warn"><div class="title">No proposed time works for all Must-Attend participants.</div><div class="body">Closest alternatives are ranked by fewest confirmed Must-Attend conflicts, then overall attendance.</div></div>`;
  } else if (pollData.mustAttend.length > 0 && rec.recommendedChoices.length > 1) {
    banner.innerHTML = `<div class="banner ok"><div class="title">${rec.recommendedChoices.length} times are tied for the recommendation.</div><div class="body">All Must-Attend availability is known for these options and their overall scores are equal. Corral is not breaking the tie arbitrarily.</div></div>`;
  } else if (pollData.mustAttend.length > 0 && rec.recommended) {
    const conditional = rec.recommended.must.conditional || [];
    const conditionalText = conditional.length ? ` ${escapeHtml(conditional.join(", "))} marked Maybe.` : "";
    banner.innerHTML = `<div class="banner ok"><div class="title">★ ${escapeHtml(formatViewerLocal(rec.recommended.iso))} is recommended.</div><div class="body">All Must-Attend participants have responded and none marked No.${conditionalText}</div></div>`;
  } else if (rec.recommendedChoices.length > 1) {
    banner.innerHTML = `<div class="banner info"><div class="title">${rec.recommendedChoices.length} times are tied for best overall availability.</div><div class="body">No Must-Attend participants are set, and Corral is not choosing an arbitrary winner.</div></div>`;
  } else if (rec.recommended) {
    banner.innerHTML = `<div class="banner info"><div class="title">${escapeHtml(formatViewerLocal(rec.recommended.iso))} has the best overall availability.</div><div class="body">No Must-Attend participants are set, so this uses the overall Yes/Maybe/No responses.</div></div>`;
  } else {
    banner.innerHTML = "";
  }

  const slotList = document.getElementById("slotList");
  if (!slotList) return;
  if (pollData.slots.length === 0) {
    slotList.innerHTML = '<div class="empty-note">No proposed times yet.</div>';
    return;
  }

  slotList.innerHTML = rec.withTally.map((slot) => {
    const badges = badgesForSlot(slot, rec, pollData.mustAttend.length);
    const isClosestAlt = rec.noFullyEligible && rec.closestAlternatives.some((a) => a.id === slot.id);
    const isFinalized = pollData.finalizedSlotId === slot.id;
    const badgeHtml = badges.map((b) => `<span class="pill ${escapeAttr(b.tone)}">${escapeHtml(b.label)}</span>`).join("") || (isClosestAlt ? '<span class="pill neutral">Closest alternative</span>' : "");

    let mustLine = "";
    if (slot.must.unavailable.length > 0) {
      mustLine = `<div class="must-line warn">⚠ Must-Attend unavailable: <strong>&nbsp;${escapeHtml(slot.must.unavailable.join(", "))}</strong></div>`;
    } else if (slot.must.unknown.length > 0) {
      mustLine = `<div class="must-line" style="color:var(--ink-faint);">Awaiting response from: <strong>&nbsp;${escapeHtml(slot.must.unknown.join(", "))}</strong></div>`;
    } else if (slot.must.conditional.length > 0) {
      mustLine = `<div class="must-line ok">✓ All Must-Attend can attend · Maybe: <strong>&nbsp;${escapeHtml(slot.must.conditional.join(", "))}</strong></div>`;
    } else if (pollData.mustAttend.length > 0) {
      mustLine = '<div class="must-line ok">✓ All Must-Attend participants available</div>';
    }

    const actionBtn = isFinalized
      ? '<button class="ghost" data-unfinalize="1" style="border-color:var(--teal); color:var(--teal);">✓ Finalized — undo</button>'
      : `<button class="ghost" data-finalize="${escapeAttr(slot.id)}">🔒 Finalize this time</button>`;

    return `<div class="slot ${isFinalized ? "selected" : ""}">
      <div class="slot-head"><div><div class="slot-title serif">${escapeHtml(formatViewerLocal(slot.iso))}</div><div class="stat-row"><span class="yes"><strong>${slot.tally.yes}</strong> Yes</span><span class="ifn"><strong>${slot.tally.ifNeeded}</strong> Maybe</span><span class="no"><strong>${slot.tally.no}</strong> No</span></div></div>${actionBtn}</div>
      <div class="badges">${badgeHtml}</div>${mustLine}</div>`;
  }).join("");

  slotList.querySelectorAll("[data-finalize]").forEach((btn) => btn.addEventListener("click", () => finalizeSlot(btn.getAttribute("data-finalize"))));
  slotList.querySelectorAll("[data-unfinalize]").forEach((btn) => btn.addEventListener("click", unfinalize));
}

function startOrganizerPolling() {
  if (organizerPollTimer) clearInterval(organizerPollTimer);
  organizerPollTimer = setInterval(async () => {
    try {
      const latest = await fetchPollData();
      pollData = latest;
      renderFinalizedBanner();
      renderResults();
    } catch {
      // Keep the current screen; the next interval will retry.
    }
  }, 8000);
}
</script>
</body>
</html>
